name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Lint + tests (gateway, bench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            gateway/requirements.txt
            bench/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  compose:
    name: Compose config + gateway image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose (all profiles, both env layers)
        run: |
          cp compose/.env.example compose/.env
          docker compose -f compose/docker-compose.yml --env-file compose/.env --profile all config --quiet
          docker compose -f compose/docker-compose.yml --env-file compose/.env --env-file compose/all.env --profile all config --quiet
      - name: Build and smoke-test gateway image (no GPU backends)
        run: |
          docker build -t llm-serving-lab/gateway:ci gateway
          docker run -d --name gw -p 8000:8000 llm-serving-lab/gateway:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS localhost:8000/v1/models | grep -q '"vllm/qwen2.5-1.5b"'
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/v1/chat/completions \
            -H 'content-type: application/json' \
            -d '{"model":"vllm/qwen2.5-1.5b","messages":[{"role":"user","content":"hi"}]}')
          echo "chat status without backend: $code"; test "$code" = "502"
          docker logs gw | tail -n 5
          docker rm -f gw

  infra:
    name: Bicep build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null

  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh infra/*.sh
